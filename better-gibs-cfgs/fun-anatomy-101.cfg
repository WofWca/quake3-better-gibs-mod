// 23 is when the skull might appear a second time.
// We want it more likely to appear.
set cg_gibs 2.3
reset cg_oldGibs
reset cg_gibsInheritPlayerVelocity
set cg_gibsPiecesFromKnockback 1.0
// This might add a bit of randomness to the initial gib positions? Not sure.
reset cg_gibsRandomVelocityFromKnockback
reset cg_gibsVerticalVelocityFromKnockback
reset cg_gibsExtraRandomVelocity
set cg_gibsExtraVerticalVelocity -999999999
set cg_gibsBounceFactor 0
set cg_gibsBounceFactorRandomness 0
set cg_gibsRotationFactor 0
// Don't fly far away
set cg_gibsBetterCameraOnGib 0
reset cg_bounceMarksMinImpactSpeed
// Otherwise this makes a really loud noise.
set cg_bounceSoundMinImpactSpeed 9999999999

reset g_oldGibs
// Don't fly far away.
set g_gibsMissileDirectionKnockbackWeight 1
reset g_gibsNewEvGibPlayerParmProtocol
reset g_gibsOnCollisionMinSpeed
reset g_gibsOnCollisionBaseDamage
reset g_gibsOnCollisionAffectLivePlayers
reset g_gibsOnCollisionInheritPlayerVelocity
