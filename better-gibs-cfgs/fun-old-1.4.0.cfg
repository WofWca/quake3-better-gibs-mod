// And the old value was 1.6, so 6 extra pieces for 1000 knockback.
set cg_gibsPiecesFromKnockback 1.2
set cg_gibsLinearVelocityFromKnockback 1.0
set cg_gibsRandomVelocityFromKnockback 0.4
set cg_gibsVerticalVelocityFromKnockback 0.2
set cg_gibsExtraRandomVelocity 100
set cg_gibsExtraVerticalVelocity 50
set cg_gibsPlayerSpeedFromKnockback 0.0
set cg_gibsPlayerSpeedFromKnockbackMaxFraction 0.0
set cg_gibsDuration 5000
set cg_gibsOriginalOrigin 0.0
set cg_gibsNoLerpDelay 0
set cg_gibsBounceFactor 0.4
set cg_gibsBounceFactorRandomness 0.5
set cg_gibsRotationFactor 1.0
set cg_gibsBloodTrailPeriod 150
set cg_gibsFireTrailPeriod -1
set cg_gibsFireTrailDuration 0
set cg_gibsFireTrailMinKnockback -1
set cg_gibsBetterCameraOnGib 1
set cg_marks 1
set cg_bounceMarksMinImpactSpeed 350
set cg_bounceSoundMinImpactSpeed 450

set g_oldGibs 0
set g_gibsMissileDirectionKnockbackWeight 0.5
// The protocol was different, but I think we can even go for `reset` here.
set g_gibsNewEvGibPlayerProtocol 30
set g_gibsDeadBodyLinearVelocityFromKnockback 0
set g_gibsOnCollisionMinSpeed 1000
set g_gibsOnCollisionBaseDamage 100
