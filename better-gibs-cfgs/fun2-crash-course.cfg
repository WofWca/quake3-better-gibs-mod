// This one changes gameplay significantly, so we don't list it
// among other configs.
//
// It would be fun to combine this with e.g. sticky gibs.
set cg_gibs 1.1
reset cg_oldGibs
reset cg_gibsInheritPlayerVelocity
reset cg_gibsPiecesFromKnockback
reset cg_gibsRandomVelocityFromKnockback
reset cg_gibsVerticalVelocityFromKnockback
reset cg_gibsExtraRandomVelocity
reset cg_gibsExtraVerticalVelocity
reset cg_gibsBounceFactor
reset cg_gibsBounceFactorRandomness
reset cg_gibsRotationFactor
reset cg_gibsBetterCameraOnGib
reset cg_bounceMarksMinImpactSpeed
reset cg_bounceSoundMinImpactSpeed

reset g_oldGibs
reset g_gibsMissileDirectionKnockbackWeight
reset g_gibsNewEvGibPlayerParmProtocol
set g_gibsOnCollisionMinSpeed 1000
set g_gibsOnCollisionBaseDamage 150
set g_gibsOnCollisionAffectLivePlayers 1
reset g_gibsOnCollisionInheritPlayerVelocity

set g_speed 2000
addbot crash 1
addbot crash 1
addbot crash 1
addbot crash 1
addbot crash 1
